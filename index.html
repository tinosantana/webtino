<style>
  :root {
    --bg-1: #1d1d3a;
    --bg-2: #14142a;
    --accent: #7b7bf5;
    --accent-hi: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-1), var(--bg-2) 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #stars { position: fixed; inset: 0; pointer-events: none; }
  .star {
    position: absolute; border-radius: 50%; background: var(--accent); opacity: .5;
    animation: twinkle var(--d) ease-in-out var(--delay) infinite alternate;
  }
  @keyframes twinkle { from { opacity: .15; } to { opacity: .8; } }

  .card {
    width: min(422px, 88vw);
    aspect-ratio: 422 / 398;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
    border-radius: 28px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }

  /* Nariz negra con un halo violeta muy tenue y estático */
  .nose {
    width: 38%; height: auto; overflow: visible;
    color: #000;
    filter: drop-shadow(0 0 1px rgba(190,190,255,.3)) drop-shadow(0 0 9px rgba(123,123,245,.16));
    clip-path: inset(0 0 100% 0);
    animation: reveal 2.2s ease-out .2s forwards;
  }
  @keyframes reveal { to { clip-path: inset(0); } }

  h1 {
    font-weight: 200; font-size: clamp(1.5rem, 6vw, 2.1rem);
    letter-spacing: .08em; color: var(--accent); white-space: nowrap;
  }
  h1 span { transition: color .8s ease; }
  h1 span.on { color: var(--accent-hi); }

  @media (prefers-reduced-motion: reduce) {
    .star { animation: none; }
    .nose { animation: none; clip-path: none; }
  }
</style>

<script>
  // Estrellas de fondo
  var stars = document.getElementById('stars');
  for (var i = 0, n = innerWidth < 600 ? 40 : 70; i < n; i++) {
    var s = document.createElement('div'), size = Math.random() * 2.6 + .8;
    s.className = 'star';
    s.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + Math.random() * 100 +
      '%;top:' + Math.random() * 100 + '%;--d:' + (3 + Math.random() * 5) + 's;--delay:-' + Math.random() * 6 + 's';
    stars.appendChild(s);
  }

  // Destello que recorre las letras, con una pausa al terminar
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var h = document.getElementById('title'), text = h.textContent, step = 0;
    h.setAttribute('aria-label', text);
    h.textContent = '';
    var letters = text.split('').map(function (c) {
      var l = document.createElement('span');
      l.textContent = c;
      l.setAttribute('aria-hidden', 'true');
      h.appendChild(l);
      return l;
    });
    setInterval(function () {
      letters.forEach(function (l, k) { l.classList.toggle('on', k === step); });
      step = (step + 1) % (letters.length + 4);
    }, 450);
  }
</script>
