<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinosantana.com</title>
<style>
  :root {
    --bg-1: #1b1b36;
    --bg-2: #14142a;
    --card: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.09);
    --accent: #7b7bf5;
    --accent-end: #ffffff;
    --star: #6b6bd6;
    --stroke: #000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-1) 0%, var(--bg-2) 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #stars { position: fixed; inset: 0; pointer-events: none; }
  .star {
    position: absolute;
    border-radius: 50%;
    background: var(--star);
    opacity: .5;
    animation: twinkle var(--d, 4s) ease-in-out infinite alternate;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle { from { opacity: .15; } to { opacity: .8; } }

  .card {
    position: relative;
    width: min(422px, 88vw);
    aspect-ratio: 422 / 398;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .nose { width: 48%; height: auto; overflow: visible; }
  .nose path {
    fill: none;
    stroke: var(--stroke);
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 1.6s ease forwards;
  }
  .nose path:nth-child(2) { animation-delay: 1.4s; animation-duration: .6s; }
  .nose path:nth-child(3) { animation-delay: 1.9s; animation-duration: .5s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  h1 {
    font-weight: 200;
    font-size: clamp(1.5rem, 6vw, 2.1rem);
    letter-spacing: .08em;
    color: var(--accent);
    white-space: nowrap;
  }
  h1 span { transition: color .4s; }
  h1 span.on { color: var(--accent-end); }

  @media (prefers-reduced-motion: reduce) {
    .star, .nose path { animation: none; }
    .nose path { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
  <div id="stars" aria-hidden="true"></div>

  <main class="card">
    <svg class="nose" viewBox="0 0 130 210" role="img" aria-label="Dibujo de una nariz">
      <path pathLength="1" d="M29 9 C30 18 55 30 70 45 C85 62 98 78 104 100 C112 125 118 150 110 178 C106 186 90 188 80 190 C68 192 62 194 57 201"/>
      <path pathLength="1" d="M28 136 C20 146 8 152 10 162 C12 176 20 184 27 190"/>
      <path pathLength="1" d="M40 183 C52 176 65 174 83 178"/>
    </svg>
    <h1 id="title" aria-label="tinosantana.com"></h1>
  </main>

<script>
  // Estrellas de fondo
  (function () {
    var box = document.getElementById('stars');
    var n = 70;
    for (var i = 0; i < n; i++) {
      var s = document.createElement('div');
      var size = Math.random() * 2.6 + 0.8;
      s.className = 'star';
      s.style.width = s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--d', (3 + Math.random() * 5) + 's');
      s.style.setProperty('--delay', (-Math.random() * 6) + 's');
      box.appendChild(s);
    }
  })();

  // Título letra a letra con un destello que recorre el texto
  (function () {
    var h = document.getElementById('title');
    var text = 'tinosantana.com';
    var spans = text.split('').map(function (ch) {
      var s = document.createElement('span');
      s.textContent = ch;
      s.setAttribute('aria-hidden', 'true');
      h.appendChild(s);
      return s;
    });
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var i = 0;
    setInterval(function () {
      spans.forEach(function (s, k) { s.classList.toggle('on', k === i); });
      i = (i + 1) % spans.length;
    }, 220);
  })();
</script>
</body>
</html>
